[package]
name = "pop-vega"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Vega (Spartan/Hyrax over T-256) proof that a registered passkey signed a WebAuthn challenge"

[dependencies]
vega-prover = { workspace = true }
bellpepper = { workspace = true }
bellpepper-core = { workspace = true }
ff = { workspace = true }
num-bigint = "0.4"
num-traits = "0.2"
halo2curves = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"
base64 = "0.22"
thiserror = "2.0"
sha2 = { version = "0.10", features = ["compress"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
flate2 = "1.0"

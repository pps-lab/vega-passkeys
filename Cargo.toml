[workspace]
resolver = "2"
members = ["core", "wasm"]

[workspace.dependencies]
# Pinned: v0.1.0, unaudited, API not stable.
vega-prover = { git = "https://github.com/microsoft/vega-prover.git", rev = "c0ee259053cd12eaf43ed71b5cde375452b3ee4d" }
bellpepper = "0.4.0"
bellpepper-core = "0.4.0"
ff = { version = "0.13.0", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1

# third_party/vega-prover is the pinned revision plus patches/ (see scripts/fetch-vega-prover.sh).
[patch."https://github.com/microsoft/vega-prover.git"]
vega-prover = { path = "third_party/vega-prover" }
